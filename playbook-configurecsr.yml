---
- name: Configuration du routeur CSR1000
  hosts: csr1000
  gather_facts: false

  tasks:

    # Configuration des adresses IP (couche 3)
    - name: Configuration des adresses IP des interfaces
      cisco.ios.ios_l3_interfaces:
        config:
          - name: GigabitEthernet1
            ipv4:
              - dhcp:
                  enable: true
          - name: GigabitEthernet2
            ipv4:
              - address: 192.168.2.1/24
          - name: GigabitEthernet3
            ipv4:
              - address: 192.168.3.1/24
          - name: GigabitEthernet4
            ipv4:
              - address: 192.168.4.1/24
        state: merged

    # Activation des interfaces et descriptions
    - name: Activation et description des interfaces
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: "WAN - DHCP"
            enabled: true
          - name: GigabitEthernet2
            description: "ADJA - 192.168.2.0/24"
            enabled: true
          - name: GigabitEthernet3
            description: "AIDA - 192.168.3.0/24"
            enabled: true
          - name: GigabitEthernet4
            description: "NDIAYE - 192.168.4.0/24"
            enabled: true
        state: merged
    # Suppression du pool DHCP existant pour éviter les erreurs si on relance
    - name: Suppression du pool DHCP existant
      cisco.ios.ios_config:
        lines:
          - no ip dhcp pool LAN_ENTREPRISE

    # Configuration du serveur DHCP
    - name: Configuration du serveur DHCP
      cisco.ios.ios_config:
        lines:
          - network 192.168.2.0 255.255.255.0
          - default-router 192.168.2.1
          - dns-server 8.8.8.8
        parents: ip dhcp pool LAN_ENTREPRISE
    # Interface WAN en nat outside
    - name: Configuration NAT outside sur GigabitEthernet1
      cisco.ios.ios_config:
        lines:
          - ip nat outside
        parents: interface GigabitEthernet1

    # Interfaces LAN en nat inside avec loop
    - name: Configuration NAT inside sur GigabitEthernet 2 3 et 4
      cisco.ios.ios_config:
        lines:
          - ip nat inside
        parents: "interface GigabitEthernet{{ item }}"
      loop:
        - 2
        - 3
        - 4

    # ACL pour le NAT dynamique
    - name: Configuration de l ACL pour le NAT
      cisco.ios.ios_config:
        lines:
          - access-list 1 permit 192.168.0.0 0.0.255.255

    # Activation du PAT dynamique
    - name: Activation du PAT dynamique
      cisco.ios.ios_config:
        lines:
          - ip nat inside source list 1 interface GigabitEthernet1 overload